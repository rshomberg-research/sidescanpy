[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidescanpy"
version = "0.1.0"
description = "Process and analyze sonar data (JSF, XTF, etc) with netCDF interchange format"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Russ Shomberg"}]

dependencies = [
    "xarray>=2023.0",
    "netCDF4>=1.6",
    "numpy>=1.20",
    "scipy>=1.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "black", "ruff"]

[tool.setuptools]
packages = ["sidescanpy"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
sidescanpy = ["py.typed"]
