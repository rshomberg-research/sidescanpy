[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar_utils"
version = "0.1.0"
description = "Utilities for sonar and project scripts"
authors = [{ name = "Russ Shomberg" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["libpy"]
