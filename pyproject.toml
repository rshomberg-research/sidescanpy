[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jsfpy"
version = "0.1.0"
description = "Tools for reading and processing JSF side scan sonar files."
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

# Optional dependencies your package needs
dependencies = [
    "numpy",
    "xarray",
    "netCDF4",
]

[project.urls]
homepage = "https://example.com"
repository = "https://github.com/youruser/jsfpy"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
