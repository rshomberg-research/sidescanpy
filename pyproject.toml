[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidescanpy"
version = "0.6.0"
description = "Read, correct, grid and export sidescan sonar data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sidescan", "sonar", "bathymetry", "geophysics", "marine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
authors = [{name = "Russ Shomberg"}]
requires-python = ">=3.12"
dependencies = [
    "xarray>=2023.0",
    "h5py>=3.0",
    "h5netcdf>=1.0",
    "numpy>=1.20",
    "pandas>=1.0",
    "dask",
    "pyproj>=3.6",
    "scipy>=1.10",
    "pynmea2>=1.18",
    "pyyaml>=6.0.3",
    # Single-channel 8/16-bit grayscale PNG writing for dataset export
    # (chips, windows); independent of matplotlib, so it stays core.
    "pillow>=9.0",
]

[project.urls]
Repository = "https://github.com/rshomberg-uri/sidescanpy"

[project.scripts]
sidescan-convert = "sidescanpy.cli.convert:main"
sidescan-correct = "sidescanpy.cli.correct:main"
sidescan-export = "sidescanpy.cli.export:main"
sidescan-analyze = "sidescanpy.cli.analyze:main"

[project.optional-dependencies]
dev = [
    # viz tests must run, not skip, in the dev environment.
    "matplotlib>=3.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-xdist>=3.0",
    "ruff>=0.6",
]
viz = [
    # sidescanpy.viz plotting helpers and the sidescan-export /
    # sidescan-analyze figure output. Everything else (io, processing,
    # analysis, grids, targets, export, sidescan-convert,
    # sidescan-correct) imports and runs without it.
    "matplotlib>=3.0",
]
maps = [
    # Used by viz/basemap.py to draw land/water context behind a
    # georeferenced plot (gridded raster, track) and a zoomed-out locator
    # thumbnail. Vendored Natural Earth data (assets/natural_earth/,
    # public domain) ships with the package regardless of whether this
    # extra is installed -- only the cartopy import itself is optional,
    # gated at each basemap function's own call site. Basemaps draw on
    # matplotlib axes, so this extra implies viz.
    "matplotlib>=3.0",
    "cartopy>=0.24",
]
geo = [
    # GeoTIFF output for gridded rasters (sidescanpy.grids.to_geotiff).
    # rioxarray writes an xarray grid with its CRS, affine transform and
    # nodata through rasterio/GDAL -- the established way to do this,
    # instead of hand-building GeoTIFF tags. Only to_geotiff imports it,
    # lazily; everything else in grids runs without it.
    "rioxarray>=0.15",
]
docs = [
    # The documentation site (mkdocs.yml): guide pages in docs/ plus API
    # reference generated from the numpydoc docstrings. Build-time only.
    # mkdocs<2: MkDocs 2.0 drops the plugin system mkdocstrings needs.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is not enforced yet
    "E741",  # ambiguous variable names (l, I) are common in numeric code
    "B008",
    "B905",  # zip() without strict=
    "UP006", "UP007", "UP035", "UP045",  # typing.List/Optional style, migrate later
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidescanpy = ["assets/natural_earth/**/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests for individual functions/classes",
    "integration: Integration tests across multiple modules",
    "slow: Tests that take a long time to run",
    "requires_data: Tests requiring test data files",
]

[tool.coverage.run]
source = ["src/sidescanpy"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
