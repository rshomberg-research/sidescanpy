[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidescanpy"
version = "0.4.19"
description = "..."
authors = [{name = "Russ Shomberg"}]
requires-python = ">=3.12"
dependencies = [
    "xarray>=2023.0",
    "h5py>=3.0",
    "h5netcdf>=1.0",
    "numpy>=1.20",
    "pandas>=1.0",
    "matplotlib>=3.0",
    "dask",
    "pyproj>=3.6",
    "scipy>=1.10",
    "pynmea2>=1.18",
]

[project.scripts]
sidescan-convert = "sidescanpy.cli.convert:main"
sidescan-correct = "sidescanpy.cli.correct:main"
sidescan-export = "sidescanpy.cli.export:main"
sidescan-analyze = "sidescanpy.cli.analyze:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-xdist>=3.0",
]
maps = [
    # Used by viz/basemap.py to draw land/water context behind a
    # georeferenced plot (gridded raster, track) and a zoomed-out locator
    # thumbnail. Vendored Natural Earth data (assets/natural_earth/,
    # public domain) ships with the package regardless of whether this
    # extra is installed -- only the cartopy import itself is optional,
    # gated at each basemap function's own call site.
    "cartopy>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidescanpy = ["processing/calibration/*.json", "assets/natural_earth/**/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests for individual functions/classes",
    "integration: Integration tests across multiple modules",
    "slow: Tests that take a long time to run",
    "requires_data: Tests requiring test data files",
]

[tool.coverage.run]
source = ["src/sidescanpy"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]