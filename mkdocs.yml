site_name: sidescanpy
site_description: Read, correct, grid and export sidescan sonar data
repo_url: https://github.com/rshomberg-uri/sidescanpy
docs_dir: docs
exclude_docs: |
  _internal/
  gen_ref_pages.py

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            show_signature_annotations: true
            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - Guide:
      - Building a workflow: workflow.md
      - Data model: core.md
      - Processing: processing.md
      - Gridding: grids.md
      - Targets and datasets: datasets.md
      - Analysis: analysis.md
      - Visualization: viz.md
      - Command line: cli.md
      - Logging: logging.md
  - Formats:
      - JSF: io_jsf.md
      - JSF aux sources: jsf_aux_source_selection.md
      - SDF: io_sdf.md
      - HDF5 (.ss.h5): io_hdf5.md
      - NetCDF: io_netcdf.md
  - API reference: reference/
  - Development: development.md
