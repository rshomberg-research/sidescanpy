site_name: sidescanpy
site_description: Read, correct, grid and export sidescan sonar data
repo_url: https://github.com/rshomberg-uri/sidescanpy
docs_dir: docs
exclude_docs: |
  _internal/

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - Guide:
      - Data model: core.md
      - Processing: processing.md
      - Gridding: grids.md
      - Targets and datasets: datasets.md
      - Analysis: analysis.md
      - Visualization: viz.md
      - Command line: cli.md
      - Logging: logging.md
  - Formats:
      - JSF: io_jsf.md
      - JSF aux sources: jsf_aux_source_selection.md
      - SDF: io_sdf.md
      - HDF5 (.ss.h5): io_hdf5.md
      - NetCDF: io_netcdf.md
  - API reference:
      - Core: api/core.md
      - IO: api/io.md
      - Processing: api/processing.md
      - Analysis: api/analysis.md
      - Grids: api/grids.md
      - Targets: api/targets.md
      - Export: api/export.md
      - Visualization: api/viz.md
      - Logging: api/log.md
  - Development: development.md
