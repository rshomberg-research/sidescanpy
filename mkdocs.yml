site_name: sidescanpy
site_description: Read, correct, grid and export sidescan sonar data
site_url: https://rshomberg-research.github.io/sidescanpy/
# The site is public but the repository is private until release, so no
# repo_url (its header link and edit buttons would 404 for most readers).
# At release: repo_url: https://github.com/rshomberg-research/sidescanpy
docs_dir: docs
exclude_docs: |
  gen_ref_pages.py
  build_gallery.py

theme:
  name: material
  # Pre-release noindex meta tag; drop at the public release.
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets:
      # Example pages include the scripts in examples/gallery/ verbatim.
      base_path: ["."]
      check_paths: true
  - attr_list
  - md_in_html

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: false
            show_signature_annotations: true
            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - Pre-release status: prerelease.md
  - Examples:
      - examples/index.md
      - Read a file: examples/read_a_file.md
      - Correct a line: examples/correct_a_line.md
      - Grid to a map: examples/grid_to_a_map.md
      - Three formats, one model: examples/three_formats.md
  - Guide:
      - Building a workflow: workflow.md
      - Data model: core.md
      - Processing: processing.md
      - Gridding: grids.md
      - Targets and datasets: datasets.md
      - Analysis: analysis.md
      - Visualization: viz.md
      - Command line: cli.md
      - Logging: logging.md
  - Formats:
      - JSF: io_jsf.md
      - JSF aux sources: jsf_aux_source_selection.md
      - SDF: io_sdf.md
      - XTF: io_xtf.md
      - HDF5 (.ss.h5): io_hdf5.md
      - NetCDF: io_netcdf.md
  - API reference: reference/
  - Development: development.md
