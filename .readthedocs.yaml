# Read the Docs build (https://docs.readthedocs.io/en/stable/config-file/v2.html).
# The API pages are generated from the docstrings at build time by
# docs/gen_ref_pages.py, so nothing generated is committed.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Optional: set DISABLE_MKDOCS_2_WARNING=true under the project's
# Settings > Environment variables to silence a notice the
# gen-files/literate-nav plugins print. It does not affect the build.

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
