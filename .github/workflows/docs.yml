# Build the documentation site on every push and pull request with
# Sphinx (-W -n: any warning, such as a malformed docstring or an
# unresolved cross-reference, fails the build). The build runs the
# examples/gallery/ and examples/theory/ scripts through sphinx-gallery;
# the public recordings they download (about 1.3 GB) are cached between
# runs. Then the Python blocks of the getting-started page and the
# quickstart on the home page run (make docs-code) on the same cached
# data; the tests workflow skips them, having no data. Builds from main and from
# version tags are kept as a downloadable "sidescanpy-docs" artifact
# (90 days).
#
# Builds from main are also published to
# https://rshomberg-research.github.io/sidescanpy/ by pushing the built
# site into the sidescanpy/ folder of rshomberg-research.github.io.
# Publishing is opt-in: it needs the repository variable PUBLISH_DOCS=true
# and the secret DOCS_DEPLOY_KEY (the private half of a deploy key with
# write access on the site repository). Setup: docs/development.md,
# "Publishing".
name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIDESCANPY_DATA_DIR: ${{ github.workspace }}/.sidescanpy-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The registry (names, URLs, checksums) lives in datasets.py, so a
      # change there starts a fresh cache; fetch() re-checks every file.
      - uses: actions/cache@v4
        with:
          path: .sidescanpy-data
          key: sidescanpy-data-${{ hashFiles('src/sidescanpy/datasets.py') }}
          restore-keys: sidescanpy-data-
      - name: Build (warnings are errors, gallery executed)
        run: make docs
      - name: Run the code blocks of the guide pages
        run: make docs-code
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sidescanpy-docs
          path: docs/_build/html
          retention-days: 90

  publish:
    if: vars.PUBLISH_DOCS == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docs-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidescanpy-docs
          path: site
      - uses: actions/checkout@v4
        with:
          repository: rshomberg-research/rshomberg-research.github.io
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: pages
      - name: Replace sidescanpy/ and push
        run: |
          rm -rf pages/sidescanpy
          cp -r site pages/sidescanpy
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "site unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "sidescanpy docs from ${GITHUB_SHA::7}"
          git push
